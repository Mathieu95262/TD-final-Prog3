server:
  port: 8080
  address: 0.0.0.0

spring:
  application:
    name: agricultural-federation-api

  datasource:
    url: jdbc:postgresql://localhost:5432/agricole_federation
    username: postgres
    password: admin123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    defer-datasource-initialization: true

  sql:
    init:
      mode: always
      data-locations: classpath:data.sql