openapi: 3.0.3
info:
  title: Federation de Collectivites Agricoles API
  description: |
    API REST - PROG3 TD Final - Promotion K
    Fonctionnalites implementees :
    - **A** : Ouverture d'une nouvelle collectivite
    - **B-2** : Admission d'un nouveau membre (conditions renforcees)
    - **J** : Attribution d'un numero et d'un nom unique a une collectivite
    - **C** : Cotisations et paiements (encaissements)
    - **D** : Situation de tresorerie (caisse, comptes bancaires, comptes mobile money)
  version: 0.0.3

servers:
  - url: http://localhost:8080
    description: Serveur local de developpement

tags:
  - name: Collectivites
    description: Gestion des collectivites agricoles (A, J)
  - name: Membres
    description: Admission et gestion des membres (B-2)
  - name: Cotisations
    description: Definition des cotisations periodiques et ponctuelles (C)
  - name: Paiements
    description: Encaissements des cotisations par le tresorier (C)
  - name: Comptes
    description: Tresorerie - caisse, comptes bancaires, mobile money (D)

paths:

  # ─────────────────────────────────────────────────────────────────────────
  # A - COLLECTIVITES
  # ─────────────────────────────────────────────────────────────────────────

  /collectivities:
    post:
      tags: [Collectivites]
      summary: "A - Creer une nouvelle collectivite"
      description: |
        Conditions obligatoires (A) :
        - Au moins 10 membres fondateurs
        - Dont 5 avec une anteriorite >= 6 mois dans la federation
        - President, president adjoint, tresorier et secretaire obligatoires (un seul par poste)
        - Le numero et le nom sont attribues separement via PATCH /collectivities/{id}/identity (J)
      operationId: creerCollectivite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCollectiviteRequest'
            example:
              ville: "Antananarivo"
              specialiteAgricole: "Riziculture"
              cotisationAnnuelleObligatoire: 200000
              membres:
                - nom: "Rakoto"
                  prenom: "Jean"
                  dateNaissance: "1980-05-12"
                  genre: "MASCULIN"
                  adresse: "Lot II A 20 Tana"
                  metier: "Agriculteur"
                  telephone: "034 00 000 01"
                  email: "rakoto.jean@example.mg"
                  poste: "PRESIDENT"
                  dateAdhesionFederation: "2023-01-10"
      responses:
        '201':
          description: Collectivite creee avec succes (sans numero ni nom encore)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectiviteResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/BusinessError'

    get:
      tags: [Collectivites]
      summary: Lister toutes les collectivites
      operationId: getAllCollectivites
      responses:
        '200':
          description: Liste des collectivites
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CollectiviteResponse'

  /collectivities/{id}:
    get:
      tags: [Collectivites]
      summary: Recuperer une collectivite par son ID
      operationId: getCollectivite
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Collectivite trouvee
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectiviteResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  # ─────────────────────────────────────────────────────────────────────────
  # J - ATTRIBUTION NUMERO ET NOM
  # ─────────────────────────────────────────────────────────────────────────

  /collectivities/{id}/identity:
    patch:
      tags: [Collectivites]
      summary: "J - Attribuer un numero et un nom unique a une collectivite"
      description: |
        Fonctionnalite J :
        - Le numero et le nom sont attribues par la federation.
        - Une fois attribues, ils sont **immuables** : toute tentative de modification
          retourne 409 Conflict.
        - Le numero doit etre unique parmi toutes les collectivites.
        - Le nom doit etre unique parmi toutes les collectivites.
      operationId: assignerIdentite
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignIdentityRequest'
            example:
              numero: "COL-001"
              nom: "Collectivite Verte d'Antananarivo"
      responses:
        '200':
          description: Identite attribuee avec succes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectiviteResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Conflit - l'une des situations suivantes :
            - Le numero a deja ete attribue a cette collectivite (immuable)
            - Le nom a deja ete attribue a cette collectivite (immuable)
            - Le numero est deja utilise par une autre collectivite
            - Le nom est deja utilise par une autre collectivite
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ─────────────────────────────────────────────────────────────────────────
  # B-2 - MEMBRES
  # ─────────────────────────────────────────────────────────────────────────

  /members:
    post:
      tags: [Membres]
      summary: "B-2 - Admettre un nouveau membre dans une collectivite"
      description: |
        Nouvelles conditions d'admission (B-2) :
        1. **Parrains** : au moins 2 membres confirmes de la federation.
           - Chaque parrain doit avoir > 90 jours d'anciennete.
           - Nombre de parrains de la collectivite cible >= nombre de parrains exterieurs.
           - Exemples valides : 2 de la cible | 1 cible + 1 externe | 3 cible + 2 externes.
           - Exemple refuse : 2 parrains uniquement externes.
        2. **Relation** : la nature de la relation avec chaque parrain est obligatoire.
        3. **Paiement** : 50 000 MGA (frais adhesion) + cotisations annuelles de la collectivite.
           - Mode de paiement : VIREMENT_BANCAIRE ou MOBILE_MONEY uniquement (pas d'especes).
        4. Le membre est automatiquement cree avec le poste MEMBRE_JUNIOR.
      operationId: admettreMembre
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMembreRequest'
            example:
              collectiviteId: 1
              nom: "Rasoa"
              prenom: "Marie"
              dateNaissance: "1995-07-22"
              genre: "FEMININ"
              adresse: "Lot III B 45 Fianarantsoa"
              metier: "Eleveuse"
              telephone: "033 12 345 67"
              email: "rasoa.marie@example.mg"
              parrains:
                - parrainId: 10
                  relation: "famille"
                - parrainId: 11
                  relation: "collegue"
              montantPaye: 250000
              modePaiement: "MOBILE_MONEY"
      responses:
        '201':
          description: Membre admis avec succes (poste MEMBRE_JUNIOR)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembreResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/BusinessError'

  /members/{id}:
    get:
      tags: [Membres]
      summary: Recuperer un membre par son ID
      operationId: getMembre
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Membre trouve
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembreResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /collectivities/{collectiviteId}/members:
    get:
      tags: [Membres]
      summary: Lister les membres d'une collectivite
      operationId: getMembresByCollectivite
      parameters:
        - name: collectiviteId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Liste des membres
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MembreResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  # ─────────────────────────────────────────────────────────────────────────
  # C - COTISATIONS
  # ─────────────────────────────────────────────────────────────────────────

  /collectivities/{collectiviteId}/cotisations:
    post:
      tags: [Cotisations]
      summary: "C - Creer une cotisation pour une collectivite"
      description: |
        Les cotisations peuvent etre :
        - **MENSUELLE** : versement chaque mois
        - **ANNUELLE** : versement chaque annee
        - **PONCTUELLE** : versement unique pour un evenement specifique ou imprevu
        Un pourcentage des cotisations periodiques (MENSUELLE/ANNUELLE) est reverse a la federation.
      operationId: creerCotisation
      parameters:
        - name: collectiviteId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCotisationRequest'
            example:
              typeCotisation: "MENSUELLE"
              montant: 20000
              description: "Cotisation mensuelle standard"
      responses:
        '201':
          description: Cotisation creee
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CotisationResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'

    get:
      tags: [Cotisations]
      summary: Lister les cotisations d'une collectivite
      operationId: getCotisations
      parameters:
        - name: collectiviteId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Liste des cotisations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CotisationResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /collectivities/{collectiviteId}/cotisations/{cotisationId}:
    get:
      tags: [Cotisations]
      summary: Recuperer une cotisation par son ID
      operationId: getCotisation
      parameters:
        - name: collectiviteId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: cotisationId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Cotisation trouvee
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CotisationResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /collectivities/{collectiviteId}/cotisations/{cotisationId}/paiements:
    get:
      tags: [Paiements]
      summary: "C - Paiements effectues pour une cotisation specifique"
      operationId: getPaiementsByCotisation
      parameters:
        - name: collectiviteId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: cotisationId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Liste des paiements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaiementResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  # ─────────────────────────────────────────────────────────────────────────
  # C - PAIEMENTS / ENCAISSEMENTS
  # ─────────────────────────────────────────────────────────────────────────

  /collectivities/{collectiviteId}/paiements:
    post:
      tags: [Paiements]
      summary: "C - Enregistrer un encaissement (le tresorier)"
      description: |
        Le tresorier enregistre un paiement d'un membre pour une cotisation.
        Trace obligatoire : montant, date d'encaissement, mode de paiement.
        Modes de paiement acceptes : ESPECE, VIREMENT_BANCAIRE, MOBILE_MONEY.
        Le membre doit appartenir a la meme collectivite que la cotisation.
      operationId: enregistrerPaiement
      parameters:
        - name: collectiviteId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaiementRequest'
            example:
              membreId: 5
              cotisationId: 2
              montant: 20000
              dateEncaissement: "2026-04-22"
              modePaiement: "MOBILE_MONEY"
      responses:
        '201':
          description: Paiement enregistre
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaiementResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/BusinessError'

    get:
      tags: [Paiements]
      summary: "C - Paiements d'une collectivite sur une periode"
      operationId: getPaiementsCollectivite
      parameters:
        - name: collectiviteId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: debut
          in: query
          required: true
          schema:
            type: string
            format: date
          example: "2026-01-01"
        - name: fin
          in: query
          required: true
          schema:
            type: string
            format: date
          example: "2026-12-31"
      responses:
        '200':
          description: Liste des paiements sur la periode
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaiementResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/BusinessError'

  /members/{membreId}/paiements:
    get:
      tags: [Paiements]
      summary: "C - Historique des paiements d'un membre"
      operationId: getPaiementsMembre
      parameters:
        - name: membreId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Liste des paiements du membre
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaiementResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  # ─────────────────────────────────────────────────────────────────────────
  # D - TRESORERIE - COMPTES DES COLLECTIVITES
  # ─────────────────────────────────────────────────────────────────────────

  /collectivities/{collectiviteId}/comptes/caisse:
    post:
      tags: [Comptes]
      summary: "D - Creer la caisse d'une collectivite (une seule autorisee)"
      description: |
        Regle D : une collectivite ne peut avoir qu'**une seule caisse**.
        Les especes sont stockees directement dans la caisse.
        Retourne 409 si une caisse existe deja pour cette collectivite.
      operationId: creerCaisseCollectivite
      parameters:
        - name: collectiviteId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nomTitulaire]
              properties:
                nomTitulaire:
                  type: string
                  example: "Caisse principale"
      responses:
        '201':
          description: Caisse creee
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompteResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /collectivities/{collectiviteId}/comptes/bancaire:
    post:
      tags: [Comptes]
      summary: "D - Creer un compte bancaire pour une collectivite"
      description: |
        Une collectivite peut avoir **plusieurs comptes bancaires**.
        Banques autorisees : BRED, MCB, BMOI, BOA, BGFI, AFG, ACCES_BANQUE, BAOBAB, SIPEM.
        Format RIB : 23 chiffres (BBBBB + GGGGG + CCCCCCCCCCC + KK).
      operationId: creerCompteBancaireCollectivite
      parameters:
        - name: collectiviteId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCompteBancaireRequest'
            example:
              nomTitulaire: "Collectivite Verte"
              nomBanque: "BOA"
              numeroCompteBancaire: "00005000000012345678901"
      responses:
        '201':
          description: Compte bancaire cree
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompteResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/BusinessError'

  /collectivities/{collectiviteId}/comptes/mobile-money:
    post:
      tags: [Comptes]
      summary: "D - Creer un compte mobile money pour une collectivite"
      description: |
        Une collectivite peut avoir **plusieurs comptes mobile money**.
        Services autorises : Orange Money, Mvola, Airtel Money.
        Le numero de telephone doit etre unique.
      operationId: creerCompteMobileMoneyCollectivite
      parameters:
        - name: collectiviteId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCompteMobileMoneyRequest'
            example:
              nomTitulaire: "Rakoto Jean"
              serviceMobileMoney: "Mvola"
              numeroTelephone: "034 12 345 67"
      responses:
        '201':
          description: Compte mobile money cree
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompteResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/BusinessError'

  /collectivities/{collectiviteId}/comptes:
    get:
      tags: [Comptes]
      summary: "D - Lister tous les comptes d'une collectivite"
      operationId: getComptesCollectivite
      parameters:
        - name: collectiviteId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Liste des comptes (caisse + bancaires + mobile money)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CompteResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  # ─────────────────────────────────────────────────────────────────────────
  # D - TRESORERIE - COMPTES DE LA FEDERATION
  # Meme principe : 1 seule caisse, N comptes bancaires, N mobile money
  # ─────────────────────────────────────────────────────────────────────────

  /federation/comptes/caisse:
    post:
      tags: [Comptes]
      summary: "D - Creer la caisse de la federation (une seule autorisee)"
      operationId: creerCaisseFederation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nomTitulaire]
              properties:
                nomTitulaire:
                  type: string
                  example: "Caisse federation nationale"
      responses:
        '201':
          description: Caisse de la federation creee
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompteResponse'
        '409':
          $ref: '#/components/responses/Conflict'

  /federation/comptes/bancaire:
    post:
      tags: [Comptes]
      summary: "D - Creer un compte bancaire pour la federation"
      operationId: creerCompteBancaireFederation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCompteBancaireRequest'
      responses:
        '201':
          description: Compte bancaire federation cree
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompteResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/BusinessError'

  /federation/comptes/mobile-money:
    post:
      tags: [Comptes]
      summary: "D - Creer un compte mobile money pour la federation"
      operationId: creerCompteMobileMoneyFederation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCompteMobileMoneyRequest'
      responses:
        '201':
          description: Compte mobile money federation cree
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompteResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/BusinessError'

  /federation/comptes:
    get:
      tags: [Comptes]
      summary: "D - Lister tous les comptes de la federation"
      operationId: getComptesFederation
      responses:
        '200':
          description: Liste des comptes de la federation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CompteResponse'

  /comptes/{id}:
    get:
      tags: [Comptes]
      summary: Recuperer un compte par son ID
      operationId: getCompte
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Compte trouve
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompteResponse'
        '404':
          $ref: '#/components/responses/NotFound'

# ─────────────────────────────────────────────────────────────────────────────
# COMPONENTS
# ─────────────────────────────────────────────────────────────────────────────

components:

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64

  responses:
    NotFound:
      description: Ressource introuvable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflit - ressource deja existante ou valeur immuable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BusinessError:
      description: Regle metier non respectee (422)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Donnees de la requete invalides (400)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'

  schemas:

    # ── Requetes ─────────────────────────────────────────────────────────────

    CreateCollectiviteRequest:
      type: object
      required: [ville, specialiteAgricole, cotisationAnnuelleObligatoire, membres]
      properties:
        ville:
          type: string
          example: "Antananarivo"
        specialiteAgricole:
          type: string
          example: "Riziculture"
        cotisationAnnuelleObligatoire:
          type: integer
          format: int64
          description: "Montant en MGA verse par chaque nouveau membre a l'adhesion"
          example: 200000
        membres:
          type: array
          minItems: 10
          description: "Au moins 10 membres, dont 5 avec >= 6 mois d'anciennete federation"
          items:
            $ref: '#/components/schemas/MembreCollectiviteRequest'

    MembreCollectiviteRequest:
      type: object
      required: [nom, prenom, dateNaissance, genre, adresse, metier, telephone, email, poste, dateAdhesionFederation]
      properties:
        nom:
          type: string
        prenom:
          type: string
        dateNaissance:
          type: string
          format: date
        genre:
          $ref: '#/components/schemas/Genre'
        adresse:
          type: string
        metier:
          type: string
        telephone:
          type: string
        email:
          type: string
          format: email
        poste:
          $ref: '#/components/schemas/Poste'
        dateAdhesionFederation:
          type: string
          format: date
          description: "Date d'adhesion dans la federation (pour valider les 6 mois d'anteriorite)"

    AssignIdentityRequest:
      type: object
      required: [numero, nom]
      properties:
        numero:
          type: string
          description: "Numero unique attribue par la federation. Immuable une fois attribue."
          example: "COL-001"
        nom:
          type: string
          description: "Nom unique attribue par la federation. Immuable une fois attribue."
          example: "Collectivite Verte d'Antananarivo"

    CreateMembreRequest:
      type: object
      required: [collectiviteId, nom, prenom, dateNaissance, genre, adresse, metier, telephone, email, parrains, montantPaye, modePaiement]
      properties:
        collectiviteId:
          type: integer
          format: int64
          description: "ID de la collectivite dans laquelle le candidat postule"
        nom:
          type: string
        prenom:
          type: string
        dateNaissance:
          type: string
          format: date
        genre:
          $ref: '#/components/schemas/Genre'
        adresse:
          type: string
        metier:
          type: string
        telephone:
          type: string
        email:
          type: string
          format: email
        parrains:
          type: array
          minItems: 2
          description: |
            Au moins 2 parrains confirmes (anciennete > 90 jours).
            Parrains de la collectivite cible >= parrains exterieurs.
          items:
            $ref: '#/components/schemas/ParrainRequest'
        montantPaye:
          type: integer
          format: int64
          description: "50 000 MGA frais adhesion + cotisations annuelles de la collectivite"
          example: 250000
        modePaiement:
          type: string
          enum: [VIREMENT_BANCAIRE, MOBILE_MONEY]
          description: "Especes interdites pour les frais d'adhesion"

    ParrainRequest:
      type: object
      required: [parrainId, relation]
      properties:
        parrainId:
          type: integer
          format: int64
        relation:
          type: string
          description: "Nature de la relation entre le candidat et le parrain"
          example: "famille"

    CreateCotisationRequest:
      type: object
      required: [typeCotisation, montant]
      properties:
        typeCotisation:
          $ref: '#/components/schemas/TypeCotisation'
        montant:
          type: integer
          format: int64
          description: "Montant en MGA"
          example: 20000
        description:
          type: string
          example: "Cotisation mensuelle standard"

    CreatePaiementRequest:
      type: object
      required: [membreId, cotisationId, montant, dateEncaissement, modePaiement]
      properties:
        membreId:
          type: integer
          format: int64
        cotisationId:
          type: integer
          format: int64
        montant:
          type: integer
          format: int64
          description: "Montant encaisse en MGA"
        dateEncaissement:
          type: string
          format: date
        modePaiement:
          $ref: '#/components/schemas/ModePaiement'

    CreateCompteBancaireRequest:
      type: object
      required: [nomTitulaire, nomBanque, numeroCompteBancaire]
      properties:
        nomTitulaire:
          type: string
        nomBanque:
          type: string
          enum: [BRED, MCB, BMOI, BOA, BGFI, AFG, ACCES_BANQUE, BAOBAB, SIPEM]
        numeroCompteBancaire:
          type: string
          pattern: '^\d{23}$'
          description: "Format : BBBBB (banque) + GGGGG (guichet) + CCCCCCCCCCC (compte) + KK (cle RIB)"
          example: "00005000000012345678901"

    CreateCompteMobileMoneyRequest:
      type: object
      required: [nomTitulaire, serviceMobileMoney, numeroTelephone]
      properties:
        nomTitulaire:
          type: string
        serviceMobileMoney:
          type: string
          enum: ["Orange Money", "Mvola", "Airtel Money"]
        numeroTelephone:
          type: string
          description: "Numero unique associe au compte mobile money"
          example: "034 12 345 67"

    # ── Reponses ──────────────────────────────────────────────────────────────

    CollectiviteResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        numero:
          type: string
          nullable: true
          description: "Null jusqu'a l'attribution via PATCH /collectivities/{id}/identity"
        nom:
          type: string
          nullable: true
          description: "Null jusqu'a l'attribution via PATCH /collectivities/{id}/identity"
        ville:
          type: string
        specialiteAgricole:
          type: string
        dateCreation:
          type: string
          format: date
        autorisationOuverture:
          type: boolean
        cotisationAnnuelleObligatoire:
          type: integer
          format: int64
        nombreMembres:
          type: integer
          format: int64

    MembreResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nom:
          type: string
        prenom:
          type: string
        dateNaissance:
          type: string
          format: date
        genre:
          $ref: '#/components/schemas/Genre'
        adresse:
          type: string
        metier:
          type: string
        telephone:
          type: string
        email:
          type: string
        dateAdhesion:
          type: string
          format: date
        poste:
          $ref: '#/components/schemas/Poste'
        actif:
          type: boolean
        collectiviteId:
          type: integer
          format: int64
        collectiviteNom:
          type: string
          nullable: true

    CotisationResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        typeCotisation:
          $ref: '#/components/schemas/TypeCotisation'
        montant:
          type: integer
          format: int64
        description:
          type: string
          nullable: true
        collectiviteId:
          type: integer
          format: int64
        collectiviteNom:
          type: string
          nullable: true

    PaiementResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        montant:
          type: integer
          format: int64
        dateEncaissement:
          type: string
          format: date
        modePaiement:
          $ref: '#/components/schemas/ModePaiement'
        membreId:
          type: integer
          format: int64
        membreNomPrenom:
          type: string
        cotisationId:
          type: integer
          format: int64
        cotisationDescription:
          type: string
          nullable: true

    CompteResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        typeCompte:
          $ref: '#/components/schemas/TypeCompte'
        nomTitulaire:
          type: string
        solde:
          type: integer
          format: int64
          description: "Solde en MGA"
        dateSolde:
          type: string
          format: date
        collectiviteId:
          type: integer
          format: int64
          nullable: true
        appartientFederation:
          type: boolean
        nomBanque:
          type: string
          nullable: true
          description: "Uniquement pour typeCompte=BANCAIRE"
          enum: [BRED, MCB, BMOI, BOA, BGFI, AFG, ACCES_BANQUE, BAOBAB, SIPEM]
        numeroCompteBancaire:
          type: string
          nullable: true
          description: "Uniquement pour typeCompte=BANCAIRE (23 chiffres)"
        serviceMobileMoney:
          type: string
          nullable: true
          description: "Uniquement pour typeCompte=MOBILE_MONEY"
          enum: ["Orange Money", "Mvola", "Airtel Money"]
        numeroTelephone:
          type: string
          nullable: true
          description: "Uniquement pour typeCompte=MOBILE_MONEY"

    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        message:
          type: string

    ValidationErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          example: 400
        errors:
          type: array
          items:
            type: string
          example: ["ville: La ville est obligatoire"]

    # ── Enumerations ──────────────────────────────────────────────────────────

    Genre:
      type: string
      enum: [MASCULIN, FEMININ]

    Poste:
      type: string
      enum: [PRESIDENT, PRESIDENT_ADJOINT, TRESORIER, SECRETAIRE, MEMBRE_CONFIRME, MEMBRE_JUNIOR]

    TypeCotisation:
      type: string
      enum: [MENSUELLE, ANNUELLE, PONCTUELLE]

    ModePaiement:
      type: string
      enum: [ESPECE, VIREMENT_BANCAIRE, MOBILE_MONEY]

    TypeCompte:
      type: string
      enum: [CAISSE, BANCAIRE, MOBILE_MONEY]
