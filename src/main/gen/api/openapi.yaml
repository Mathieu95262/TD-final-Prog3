openapi: 3.0.3
info:
  description: |
    API REST - PROG3 TD Final
    - **A** : Ouverture d'une nouvelle collectivite
    - **B-2** : Admission d'un nouveau membre (conditions renforcees)
    - **J** : Attribution d'un numero et d'un nom unique a une collectivite
    - **C** : Cotisations et paiements
    - **D** : Situation de tresorerie (comptes)
  title: Federation de Collectivites Agricoles API
  version: 0.0.3
servers:
- description: Serveur local
  url: http://localhost:8080
tags:
- name: Collectivites
- name: Membres
- name: Cotisations
- name: Paiements
- name: Comptes
paths:
  /collectivities:
    get:
      operationId: getAllCollectivites
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/CollectiviteResponse'
                type: array
          description: Liste des collectivites
      summary: Lister toutes les collectivites
      tags:
      - Collectivites
      x-accepts:
      - application/json
    post:
      description: |
        Conditions obligatoires :
        - Au moins 10 membres
        - Dont 5 avec >= 6 mois d'anciennete dans la federation
        - President, president adjoint, tresorier et secretaire obligatoires
        - Numero et nom attribues separement via PATCH /collectivities/{id}/identity
      operationId: creerCollectivite
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCollectiviteRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectiviteResponse'
          description: Collectivite creee
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
          description: Donnees invalides
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflit - ressource deja existante ou valeur immuable
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Regle metier non respectee
      summary: A - Creer une nouvelle collectivite
      tags:
      - Collectivites
      x-content-type: application/json
      x-accepts:
      - application/json
  /collectivities/{id}:
    get:
      operationId: getCollectivite
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectiviteResponse'
          description: Collectivite trouvee
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Ressource introuvable
      summary: Recuperer une collectivite par ID
      tags:
      - Collectivites
      x-accepts:
      - application/json
  /collectivities/{id}/identity:
    patch:
      description: |
        Une fois le numero ou le nom attribue, il ne peut plus etre modifie.
        Toute tentative de modification retourne 409 Conflict.
      operationId: assignerIdentite
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignIdentityRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectiviteResponse'
          description: Identite attribuee
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
          description: Donnees invalides
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Ressource introuvable
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflit - ressource deja existante ou valeur immuable
      summary: J - Attribuer numero et nom unique a une collectivite
      tags:
      - Collectivites
      x-content-type: application/json
      x-accepts:
      - application/json
  /members:
    post:
      description: |
        Nouvelles conditions d'admission :
        1. Au moins 2 parrains confirmes (anciennete > 90 jours)
        2. Parrains de la collectivite cible >= parrains exterieurs
        3. Montant = 50 000 MGA (frais adhesion) + cotisations annuelles de la collectivite
        4. Mode de paiement : VIREMENT_BANCAIRE ou MOBILE_MONEY uniquement
        5. Nature de la relation avec chaque parrain obligatoire
      operationId: admettreMembre
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMembreRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembreResponse'
          description: Membre admis (poste MEMBRE_JUNIOR attribue automatiquement)
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
          description: Donnees invalides
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Ressource introuvable
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflit - ressource deja existante ou valeur immuable
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Regle metier non respectee
      summary: B-2 - Admettre un nouveau membre
      tags:
      - Membres
      x-content-type: application/json
      x-accepts:
      - application/json
  /members/{id}:
    get:
      operationId: getMembre
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembreResponse'
          description: Membre trouve
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Ressource introuvable
      summary: Recuperer un membre par ID
      tags:
      - Membres
      x-accepts:
      - application/json
  /collectivities/{collectiviteId}/members:
    get:
      operationId: getMembresByCollectivite
      parameters:
      - explode: false
        in: path
        name: collectiviteId
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/MembreResponse'
                type: array
          description: Liste des membres
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Ressource introuvable
      summary: Lister les membres d'une collectivite
      tags:
      - Membres
      x-accepts:
      - application/json
  /members/{membreId}/paiements:
    get:
      operationId: getPaiementsMembre
      parameters:
      - explode: false
        in: path
        name: membreId
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PaiementResponse'
                type: array
          description: Liste des paiements
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Ressource introuvable
      summary: Historique des paiements d'un membre
      tags:
      - Paiements
      x-accepts:
      - application/json
  /collectivities/{collectiviteId}/cotisations:
    get:
      operationId: getCotisations
      parameters:
      - explode: false
        in: path
        name: collectiviteId
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/CotisationResponse'
                type: array
          description: Liste des cotisations
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Ressource introuvable
      summary: Lister les cotisations d'une collectivite
      tags:
      - Cotisations
      x-accepts:
      - application/json
    post:
      description: |
        Les cotisations peuvent etre MENSUELLE, ANNUELLE ou PONCTUELLE.
      operationId: creerCotisation
      parameters:
      - explode: false
        in: path
        name: collectiviteId
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCotisationRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CotisationResponse'
          description: Cotisation creee
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
          description: Donnees invalides
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Ressource introuvable
      summary: C - Creer une cotisation pour une collectivite
      tags:
      - Cotisations
      x-content-type: application/json
      x-accepts:
      - application/json
  /collectivities/{collectiviteId}/cotisations/{cotisationId}:
    get:
      operationId: getCotisation
      parameters:
      - explode: false
        in: path
        name: collectiviteId
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      - explode: false
        in: path
        name: cotisationId
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CotisationResponse'
          description: Cotisation trouvee
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Ressource introuvable
      summary: Recuperer une cotisation par ID
      tags:
      - Cotisations
      x-accepts:
      - application/json
  /collectivities/{collectiviteId}/cotisations/{cotisationId}/toggle-status:
    patch:
      operationId: toggleCotisationStatus
      parameters:
      - explode: false
        in: path
        name: collectiviteId
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      - explode: false
        in: path
        name: cotisationId
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CotisationResponse'
          description: Statut mis a jour
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Ressource introuvable
      summary: Activer ou desactiver une cotisation
      tags:
      - Cotisations
      x-accepts:
      - application/json
  /collectivities/{collectiviteId}/paiements:
    get:
      operationId: getPaiements
      parameters:
      - explode: false
        in: path
        name: collectiviteId
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      - example: 2026-01-01
        explode: true
        in: query
        name: debut
        required: true
        schema:
          format: date
          type: string
        style: form
      - example: 2026-12-31
        explode: true
        in: query
        name: fin
        required: true
        schema:
          format: date
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PaiementResponse'
                type: array
          description: Liste des paiements
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Ressource introuvable
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Regle metier non respectee
      summary: C - Paiements d'une collectivite sur une periode
      tags:
      - Paiements
      x-accepts:
      - application/json
    post:
      description: |
        Le tresorier enregistre un paiement d'un membre pour une cotisation.
        Trace : montant, date d'encaissement, mode de paiement (ESPECE, VIREMENT_BANCAIRE, MOBILE_MONEY).
      operationId: enregistrerPaiement
      parameters:
      - explode: false
        in: path
        name: collectiviteId
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaiementRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaiementResponse'
          description: Paiement enregistre
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
          description: Donnees invalides
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Ressource introuvable
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Regle metier non respectee
      summary: C - Enregistrer un encaissement (le tresorier)
      tags:
      - Paiements
      x-content-type: application/json
      x-accepts:
      - application/json
  /collectivities/{collectiviteId}/comptes/caisse:
    post:
      operationId: creerCaisseCollectivite
      parameters:
      - explode: false
        in: path
        name: collectiviteId
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCaisseRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompteResponse'
          description: Caisse creee
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Ressource introuvable
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflit - ressource deja existante ou valeur immuable
      summary: D - Creer la caisse d'une collectivite (une seule autorisee)
      tags:
      - Comptes
      x-content-type: application/json
      x-accepts:
      - application/json
  /collectivities/{collectiviteId}/comptes/bancaire:
    post:
      operationId: creerCompteBancaireCollectivite
      parameters:
      - explode: false
        in: path
        name: collectiviteId
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCompteBancaireRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompteResponse'
          description: Compte bancaire cree
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
          description: Donnees invalides
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Ressource introuvable
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflit - ressource deja existante ou valeur immuable
      summary: D - Creer un compte bancaire pour une collectivite
      tags:
      - Comptes
      x-content-type: application/json
      x-accepts:
      - application/json
  /collectivities/{collectiviteId}/comptes/mobile-money:
    post:
      operationId: creerCompteMobileMoneyCollectivite
      parameters:
      - explode: false
        in: path
        name: collectiviteId
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCompteMobileMoneyRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompteResponse'
          description: Compte mobile money cree
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
          description: Donnees invalides
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Ressource introuvable
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflit - ressource deja existante ou valeur immuable
      summary: D - Creer un compte mobile money pour une collectivite
      tags:
      - Comptes
      x-content-type: application/json
      x-accepts:
      - application/json
  /collectivities/{collectiviteId}/comptes:
    get:
      operationId: getComptesCollectivite
      parameters:
      - explode: false
        in: path
        name: collectiviteId
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/CompteResponse'
                type: array
          description: Liste des comptes
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Ressource introuvable
      summary: Lister les comptes d'une collectivite
      tags:
      - Comptes
      x-accepts:
      - application/json
  /federation/comptes/caisse:
    post:
      operationId: creerCaisseFederation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCaisseRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompteResponse'
          description: Caisse creee
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflit - ressource deja existante ou valeur immuable
      summary: D - Creer la caisse de la federation (une seule autorisee)
      tags:
      - Comptes
      x-content-type: application/json
      x-accepts:
      - application/json
  /federation/comptes/bancaire:
    post:
      operationId: creerCompteBancaireFederation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCompteBancaireRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompteResponse'
          description: Compte bancaire cree
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
          description: Donnees invalides
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflit - ressource deja existante ou valeur immuable
      summary: D - Creer un compte bancaire pour la federation
      tags:
      - Comptes
      x-content-type: application/json
      x-accepts:
      - application/json
  /federation/comptes/mobile-money:
    post:
      operationId: creerCompteMobileMoneyFederation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCompteMobileMoneyRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompteResponse'
          description: Compte mobile money cree
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
          description: Donnees invalides
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflit - ressource deja existante ou valeur immuable
      summary: D - Creer un compte mobile money pour la federation
      tags:
      - Comptes
      x-content-type: application/json
      x-accepts:
      - application/json
  /federation/comptes:
    get:
      operationId: getComptesFederation
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/CompteResponse'
                type: array
          description: Liste des comptes de la federation
      summary: Lister les comptes de la federation
      tags:
      - Comptes
      x-accepts:
      - application/json
  /comptes/{id}:
    get:
      operationId: getCompte
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompteResponse'
          description: Compte trouve
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Ressource introuvable
      summary: Recuperer un compte par ID
      tags:
      - Comptes
      x-accepts:
      - application/json
components:
  parameters:
    IdPath:
      explode: false
      in: path
      name: id
      required: true
      schema:
        format: int64
        type: integer
      style: simple
  responses:
    NotFound:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: Ressource introuvable
    Conflict:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: Conflit - ressource deja existante ou valeur immuable
    BusinessError:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: Regle metier non respectee
    ValidationError:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
      description: Donnees invalides
  schemas:
    CreateCollectiviteRequest:
      example:
        cotisationAnnuelleObligatoire: 200000
        ville: Antananarivo
        specialiteAgricole: Riziculture
        membres:
        - dateAdhesionFederation: 2000-01-23
          dateNaissance: 2000-01-23
          genre: MASCULIN
          adresse: adresse
          telephone: telephone
          poste: PRESIDENT
          nom: nom
          prenom: prenom
          email: email
          metier: metier
        - dateAdhesionFederation: 2000-01-23
          dateNaissance: 2000-01-23
          genre: MASCULIN
          adresse: adresse
          telephone: telephone
          poste: PRESIDENT
          nom: nom
          prenom: prenom
          email: email
          metier: metier
      properties:
        ville:
          example: Antananarivo
          type: string
        specialiteAgricole:
          example: Riziculture
          type: string
        cotisationAnnuelleObligatoire:
          example: 200000
          format: int64
          type: integer
        membres:
          items:
            $ref: '#/components/schemas/MembreFondateurRequest'
          minItems: 10
          type: array
      required:
      - cotisationAnnuelleObligatoire
      - membres
      - specialiteAgricole
      - ville
      type: object
    MembreFondateurRequest:
      example:
        dateAdhesionFederation: 2000-01-23
        dateNaissance: 2000-01-23
