openapi: 3.0.0
info:
  title: API Fédération de Collectivités Agricoles de Madagascar
  description: |
    API permettant la gestion digitalisée des processus administratifs de la fédération.
    Fonctionnalités couvertes :
    - A : Ouverture d'une nouvelle collectivité
    - B : Admission d'un nouveau membre
    - C : Cotisations et paiements
    - D : Gestion des comptes et trésorerie
    - E : Gestion des activités
    - F : Suivi de l'assiduité
    - G : Statistiques et rapports
  version: 1.0.0
  contact:
    name: Fédération des Collectivités Agricoles
  license:
    name: Proprietary

servers:
  - url: https://api.federation-agricole.mg/v1
    description: Serveur de production
  - url: http://localhost:8080/v1
    description: Serveur de développement

tags:
  - name: Collectivités
    description: Gestion des collectivités agricoles (A)
  - name: Membres
    description: Gestion des membres (B)
  - name: Cotisations
    description: Gestion des cotisations et paiements (C)
  - name: Comptes
    description: Gestion des comptes bancaires et trésorerie (D)
  - name: Activités
    description: Gestion des activités obligatoires et exceptionnelles (E)
  - name: Assiduité
    description: Suivi des présences aux activités (F)
  - name: Statistiques
    description: Rapports et statistiques des collectivités (G)

components:
  schemas:
    # ========== ENUMS ==========
    Genre:
      type: string
      enum: [feminin, masculin]
    
    Poste:
      type: string
      enum: [president, president_adjoint, tresorier, secretaire, membre_confirme, membre_junior]
    
    TypeCotisation:
      type: string
      enum: [mensuelle, annuelle, ponctuelle]
    
    ModePaiement:
      type: string
      enum: [espece, virement_bancaire, mobile_money]
    
    TypeCompte:
      type: string
      enum: [caisse, bancaire, mobile_money]
    
    Banque:
      type: string
      enum: [BRED, MCB, BMOI, BOA, BGFI, AFG, ACCES_BANQUE, BAOBAB, SIPEM]
    
    ServiceMobileMoney:
      type: string
      enum: [Orange_Money, Mvola, Airtel_Money]
    
    TypeActivite:
      type: string
      enum: [assemblee_generale_mensuelle, formation_junior, exceptionnelle, federation]
    
    StatutPresence:
      type: string
      enum: [present, excuse, absent]

    # ========== MODÈLES PRINCIPAUX ==========
    Adresse:
      type: object
      properties:
        rue:
          type: string
          example: "123 Avenue de l'Indépendance"
        ville:
          type: string
          example: "Antananarivo"
        code_postal:
          type: string
          example: "101"
    
    Membre:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Identifiant unique du membre
        nom:
          type: string
          example: "Rakoto"
        prenom:
          type: string
          example: "Jean"
        date_naissance:
          type: string
          format: date
          example: "1990-05-15"
        genre:
          $ref: '#/components/schemas/Genre'
        adresse:
          $ref: '#/components/schemas/Adresse'
        metier:
          type: string
          example: "Agriculteur"
        telephone:
          type: string
          pattern: '^[0-9]{10}$'
          example: "0321234567"
        email:
          type: string
          format: email
          example: "jean.rakoto@email.mg"
        date_adhesion:
          type: string
          format: date
          example: "2024-01-15"
        anciennete_jours:
          type: integer
          description: Nombre de jours depuis l'adhésion (calculé)
    
    Collectivite:
      type: object
      properties:
        id:
          type: string
          format: uuid
        numero_unique:
          type: string
          example: "COL-001"
        nom:
          type: string
          example: "Collectivité du Riz d'Antananarivo"
        ville:
          type: string
          example: "Antananarivo"
        specialite:
          type: string
          example: "Riziculture"
        date_creation:
          type: string
          format: date
          example: "2024-01-01"
        statut:
          type: string
          enum: [active, en_attente, fermee]
    
    Mandat:
      type: object
      properties:
        id:
          type: string
          format: uuid
        membre_id:
          type: string
          format: uuid
        collectivite_id:
          type: string
          format: uuid
        poste:
          $ref: '#/components/schemas/Poste'
        annee:
          type: integer
          example: 2025
        est_actif:
          type: boolean
    
    Cotisation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        membre_id:
          type: string
          format: uuid
        collectivite_id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/TypeCotisation'
        montant:
          type: integer
          minimum: 0
          description: Montant en MGA
        date_encaissement:
          type: string
          format: date-time
        mode_paiement:
          $ref: '#/components/schemas/ModePaiement'
        reference_paiement:
          type: string
          description: Référence du virement ou numéro de transaction
    
    Compte:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/TypeCompte'
        solde:
          type: integer
          description: Solde en MGA
        date_solde:
          type: string
          format: date-time
        collectivite_id:
          type: string
          format: uuid
          description: null pour le compte de la fédération
    
    CompteBancaire:
      allOf:
        - $ref: '#/components/schemas/Compte'
        - type: object
          properties:
            titulaire:
              type: string
            banque:
              $ref: '#/components/schemas/Banque'
            numero_compte:
              type: string
              pattern: '^[0-9]{5}[0-9]{5}[0-9]{11}[0-9]{2}$'
              description: 23 chiffres (5+5+11+2)
    
    CompteMobileMoney:
      allOf:
        - $ref: '#/components/schemas/Compte'
        - type: object
          properties:
            titulaire:
              type: string
            service:
              $ref: '#/components/schemas/ServiceMobileMoney'
            telephone:
              type: string
              pattern: '^[0-9]{10}$'
    
    Activite:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/TypeActivite'
        titre:
          type: string
        description:
          type: string
        date:
          type: string
          format: date
        heure:
          type: string
        lieu:
          type: string
        obligatoire:
          type: boolean
        membres_concernes:
          type: array
          items:
            type: string
            format: uuid
          description: Liste des IDs des membres concernés (null si tous)
        collectivite_id:
          type: string
          format: uuid
          description: null pour les activités de la fédération
    
    Presence:
      type: object
      properties:
        id:
          type: string
          format: uuid
        membre_id:
          type: string
          format: uuid
        activite_id:
          type: string
          format: uuid
        statut:
          $ref: '#/components/schemas/StatutPresence'
        motif_absence:
          type: string
          description: Requis si statut = excuse
        date_saisie:
          type: string
          format: date-time
    
    StatistiquesCollectivite:
      type: object
      properties:
        collectivite_id:
          type: string
          format: uuid
        periode_debut:
          type: string
          format: date
        periode_fin:
          type: string
          format: date
        nb_membres_actifs:
          type: integer
        taux_assiduite_global:
          type: number
          format: float
          minimum: 0
          maximum: 100
    
    StatistiquesMembre:
      type: object
      properties:
        membre_id:
          type: string
          format: uuid
        periode_debut:
          type: string
          format: date
        periode_fin:
          type: string
          format: date
        taux_assiduite:
          type: number
          format: float
        montant_total_encaisse:
          type: integer
        montant_impaye:
          type: integer

  parameters:
    collectiviteIdParam:
      name: collectiviteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Identifiant de la collectivité
    membreIdParam:
      name: membreId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Identifiant du membre
    activiteIdParam:
      name: activiteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Identifiant de l'activité
    compteIdParam:
      name: compteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Identifiant du compte
    anneeParam:
      name: annee
      in: query
      schema:
        type: integer
      description: Année (ex: 2025)
    moisParam:
      name: mois
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 12
      description: Mois (1-12)

  responses:
    BadRequest:
      description: Requête invalide (non-respect des conditions métier)
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              message:
                type: string
    NotFound:
      description: Ressource non trouvée
    Unauthorized:
      description: Non authentifié
    Forbidden:
      description: Accès non autorisé

# ========== PATHS (ENDPOINTS) ==========
paths:
  # ==================== A - OUVERTURE D'UNE NOUVELLE COLLECTIVITÉ ====================
  /collectivites:
    post:
      tags: [Collectivités]
      summary: Créer une nouvelle collectivité
      description: |
        Conditions d'ouverture :
        - Au moins 10 membres inscrits avec ancienneté ≥ 6 mois
        - Postes spécifiques (président, adjoint, trésorier, secrétaire) pourvus
        - Autorisation formelle de la fédération
        - Localité et spécialité définies
      operationId: creerCollectivite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nom
                - ville
                - specialite
                - membres_fondateurs_ids
                - autorisation_federation_ref
              properties:
                nom:
                  type: string
                  example: "Collectivité du Café de Fianarantsoa"
                ville:
                  type: string
                  example: "Fianarantsoa"
                specialite:
                  type: string
                  example: "Caféiculture"
                membres_fondateurs_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                  minItems: 10
                  description: IDs des 10+ membres fondateurs (doivent avoir ≥6 mois d'ancienneté)
                postes_ids:
                  type: object
                  properties:
                    president_id:
                      type: string
                      format: uuid
                    president_adjoint_id:
                      type: string
                      format: uuid
                    tresorier_id:
                      type: string
                      format: uuid
                    secretaire_id:
                      type: string
                      format: uuid
                autorisation_federation_ref:
                  type: string
                  description: Référence de l'autorisation accordée par la fédération
      responses:
        '201':
          description: Collectivité créée avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collectivite'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

    get:
      tags: [Collectivités]
      summary: Lister toutes les collectivités
      operationId: listerCollectivites
      parameters:
        - name: ville
          in: query
          schema:
            type: string
          description: Filtre par ville
        - name: specialite
          in: query
          schema:
            type: string
          description: Filtre par spécialité
      responses:
        '200':
          description: Liste des collectivités
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Collectivite'

  /collectivites/{collectiviteId}:
    get:
      tags: [Collectivités]
      summary: Obtenir les détails d'une collectivité
      parameters:
        - $ref: '#/components/parameters/collectiviteIdParam'
      responses:
        '200':
          description: Détails de la collectivité
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collectivite'
        '404':
          $ref: '#/components/responses/NotFound'

  # ==================== B - ADMISSION D'UN NOUVEAU MEMBRE ====================
  /collectivites/{collectiviteId}/membres:
    post:
      tags: [Membres]
      summary: Admettre un nouveau membre dans une collectivité
      description: |
        Conditions d'admission :
        - Être parrainé par un membre confirmé avec ancienneté > 90 jours
        - Fournir toutes les informations personnelles
        - Payer les frais d'adhésion de 50 000 MGA
      operationId: admettreMembre
      parameters:
        - $ref: '#/components/parameters/collectiviteIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nom
                - prenom
                - date_naissance
                - genre
                - adresse
                - metier
                - telephone
                - email
                - parrain_id
                - preuve_paiement
              properties:
                nom:
                  type: string
                prenom:
                  type: string
                date_naissance:
                  type: string
                  format: date
                genre:
                  $ref: '#/components/schemas/Genre'
                adresse:
                  $ref: '#/components/schemas/Adresse'
                metier:
                  type: string
                telephone:
                  type: string
                  pattern: '^[0-9]{10}$'
                email:
                  type: string
                  format: email
                parrain_id:
                  type: string
                  format: uuid
                  description: ID du membre parrain (doit être membre confirmé avec >90 jours d'ancienneté)
                preuve_paiement:
                  type: object
                  properties:
                    mode:
                      $ref: '#/components/schemas/ModePaiement'
                    reference:
                      type: string
                    montant:
                      type: integer
                      const: 50000
      responses:
        '201':
          description: Membre admis avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membre'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Collectivité ou parrain non trouvé

    get:
      tags: [Membres]
      summary: Lister les membres d'une collectivité
      parameters:
        - $ref: '#/components/parameters/collectiviteIdParam'
        - name: actif
          in: query
          schema:
            type: boolean
          description: Filtrer les membres n'ayant pas démissionné
      responses:
        '200':
          description: Liste des membres
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Membre'

  /membres/{membreId}:
    get:
      tags: [Membres]
      summary: Obtenir les détails d'un membre
      parameters:
        - $ref: '#/components/parameters/membreIdParam'
      responses:
        '200':
          description: Détails du membre
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membre'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Membres]
      summary: Modifier les informations d'un membre
      parameters:
        - $ref: '#/components/parameters/membreIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                adresse:
                  $ref: '#/components/schemas/Adresse'
                telephone:
                  type: string
                email:
                  type: string
                metier:
                  type: string
      responses:
        '200':
          description: Membre mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membre'

    delete:
      tags: [Membres]
      summary: Démission d'un membre
      description: Un membre peut démissionner s'il ne souhaite plus faire partie de la collectivité
      parameters:
        - $ref: '#/components/parameters/membreIdParam'
      responses:
        '204':
          description: Démission enregistrée
        '404':
          $ref: '#/components/responses/NotFound'

  /membres/{membreId}/changer-collectivite:
    post:
      tags: [Membres]
      summary: Changer de collectivité
      description: Permet à un membre de quitter sa collectivité actuelle pour en rejoindre une autre
      parameters:
        - $ref: '#/components/parameters/membreIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nouvelle_collectivite_id
              properties:
                nouvelle_collectivite_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Changement effectué
        '400':
          $ref: '#/components/responses/BadRequest'

  # ==================== C - COTISATIONS ET PAIEMENTS ====================
  /collectivites/{collectiviteId}/cotisations:
    post:
      tags: [Cotisations]
      summary: Enregistrer une cotisation
      description: |
        Le trésorier enregistre un encaissement avec :
        - Montant
        - Date
        - Mode de paiement (espèce, virement bancaire, mobile money)
      operationId: enregistrerCotisation
      parameters:
        - $ref: '#/components/parameters/collectiviteIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - membre_id
                - type
                - montant
                - mode_paiement
              properties:
                membre_id:
                  type: string
                  format: uuid
                type:
                  $ref: '#/components/schemas/TypeCotisation'
                montant:
                  type: integer
                  minimum: 0
                mode_paiement:
                  $ref: '#/components/schemas/ModePaiement'
                reference_paiement:
                  type: string
                  description: Pour virement ou mobile money
      responses:
        '201':
          description: Cotisation enregistrée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cotisation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: Seul le trésorier peut effectuer cette action

    get:
      tags: [Cotisations]
      summary: Lister les cotisations d'une collectivité
      parameters:
        - $ref: '#/components/parameters/collectiviteIdParam'
        - $ref: '#/components/parameters/anneeParam'
        - $ref: '#/components/parameters/moisParam'
        - name: membre_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Liste des cotisations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Cotisation'

  /federation/cotisations/reversement:
    post:
      tags: [Cotisations]
      summary: Reverser un pourcentage des cotisations à la fédération
      description: Effectué périodiquement par les collectivités
      operationId: reverserAFederation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - collectivite_id
                - montant
                - periode_debut
                - periode_fin
              properties:
                collectivite_id:
                  type: string
                  format: uuid
                montant:
                  type: integer
                periode_debut:
                  type: string
                  format: date
                periode_fin:
                  type: string
                  format: date
      responses:
        '201':
          description: Reversement enregistré
        '400':
          $ref: '#/components/responses/BadRequest'

  # ==================== D - SITUATION DE TRÉSORERIE ====================
  /collectivites/{collectiviteId}/comptes:
    get:
      tags: [Comptes]
      summary: Lister les comptes d'une collectivité
      description: Une seule caisse, plusieurs comptes bancaires et mobile money possibles
      parameters:
        - $ref: '#/components/parameters/collectiviteIdParam'
      responses:
        '200':
          description: Liste des comptes
          content:
            application/json:
              schema:
                type: array
                items:
                  oneOf:
                    - $ref: '#/components/schemas/CompteBancaire'
                    - $ref: '#/components/schemas/CompteMobileMoney'
                    - $ref: '#/components/schemas/Compte'

    post:
      tags: [Comptes]
      summary: Ajouter un compte bancaire ou mobile money
      description: Une collectivité ne peut avoir qu'une seule caisse (déjà créée par défaut)
      parameters:
        - $ref: '#/components/parameters/collectiviteIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/CompteBancaire'
                - $ref: '#/components/schemas/CompteMobileMoney'
      responses:
        '201':
          description: Compte ajouté
        '400':
          description: Compte de type caisse déjà existant (si tentative d'ajout d'une 2ème caisse)

  /collectivites/{collectiviteId}/comptes/{compteId}/solde:
    get:
      tags: [Comptes]
      summary: Obtenir le solde d'un compte à une date donnée
      parameters:
        - $ref: '#/components/parameters/collectiviteIdParam'
        - $ref: '#/components/parameters/compteIdParam'
        - name: date
          in: query
          schema:
            type: string
            format: date
          description: Date à laquelle on veut le solde (défaut = maintenant)
      responses:
        '200':
          description: Solde du compte
          content:
            application/json:
              schema:
                type: object
                properties:
                  compte_id:
                    type: string
                  solde:
                    type: integer
                  devise:
                    type: string
                    example: "MGA"
                  date:
                    type: string
                    format: date-time

  /federation/comptes:
    get:
      tags: [Comptes]
      summary: Lister les comptes de la fédération
      description: Même principe que les collectivités (une seule caisse, plusieurs comptes bancaires/Mobile Money)
      responses:
        '200':
          description: Liste des comptes de la fédération
          content:
            application/json:
              schema:
                type: array
                items:
                  oneOf:
                    - $ref: '#/components/schemas/CompteBancaire'
                    - $ref: '#/components/schemas/CompteMobileMoney'
                    - $ref: '#/components/schemas/Compte'

  # ==================== E - ACTIVITÉS ====================
  /collectivites/{collectiviteId}/activites:
    get:
      tags: [Activités]
      summary: Lister les activités d'une collectivité
      description: Inclut les activités obligatoires (AG mensuelle, formation juniors) et exceptionnelles
      parameters:
        - $ref: '#/components/parameters/collectiviteIdParam'
        - name: obligatoire
          in: query
          schema:
            type: boolean
          description: Filtrer par caractère obligatoire
      responses:
        '200':
          description: Liste des activités
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Activite'

    post:
      tags: [Activités]
      summary: Créer une activité exceptionnelle
      description: |
        Une collectivité peut créer des activités exceptionnelles.
        Elle définit si la présence est obligatoire pour tous ou seulement certains membres.
      parameters:
        - $ref: '#/components/parameters/collectiviteIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - titre
                - date
                - heure
                - lieu
              properties:
                titre:
                  type: string
                description:
                  type: string
                date:
                  type: string
                  format: date
                heure:
                  type: string
                lieu:
                  type: string
                obligatoire:
                  type: boolean
                  default: true
                membres_concernes_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: Si non renseigné, tous les membres sont concernés
      responses:
        '201':
          description: Activité exceptionnelle créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activite'

  /federation/activites:
    get:
      tags: [Activités]
      summary: Lister les activités planifiées par la fédération
      description: Activités nationales auxquelles les collectivités sont invitées
      responses:
        '200':
          description: Liste des activités fédérales
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Activite'

    post:
      tags: [Activités]
      summary: Planifier une activité fédérale
      description: La fédération peut créer des activités (obligatoires ou non)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - titre
                - date
                - heure
                - lieu
              properties:
                titre:
                  type: string
                description:
                  type: string
                date:
                  type: string
                  format: date
                heure:
                  type: string
                lieu:
                  type: string
                obligatoire:
                  type: boolean
                collectivites_concernees_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: Si non renseigné, toutes les collectivités sont invitées
      responses:
        '201':
          description: Activité fédérale planifiée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activite'

  # ==================== F - ASSIDUITÉ DES MEMBRES ====================
  /activites/{activiteId}/presences:
    post:
      tags: [Assiduité]
      summary: Enregistrer les présences à une activité
      description: |
        Le secrétaire effectue la présence.
        Un membre peut être excusé s'il a prévenu à l'avance.
      operationId: enregistrerPresences
      parameters:
        - $ref: '#/components/parameters/activiteIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - presences
              properties:
                presences:
                  type: array
                  items:
                    type: object
                    required:
                      - membre_id
                      - statut
                    properties:
                      membre_id:
                        type: string
                        format: uuid
                      statut:
                        $ref: '#/components/schemas/StatutPresence'
                      motif_absence:
                        type: string
                        description: Requis si statut = excuse
      responses:
        '201':
          description: Présences enregistrées
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: Seul le secrétaire peut effectuer cette action

    get:
      tags: [Assiduité]
      summary: Obtenir la liste des présences pour une activité
      parameters:
        - $ref: '#/components/parameters/activiteIdParam'
      responses:
        '200':
          description: Liste des présences
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Presence'

  /membres/{membreId}/assiduite:
    get:
      tags: [Assiduité]
      summary: Calculer le taux d'assiduité d'un membre sur une période
      description: |
        Note : La présence d'un membre aux activités d'autres collectivités n'est pas comptée dans son taux d'assiduité annuel.
      parameters:
        - $ref: '#/components/parameters/membreIdParam'
        - name: date_debut
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: date_fin
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Taux d'assiduité calculé
          content:
            application/json:
              schema:
                type: object
                properties:
                  membre_id:
                    type: string
                  taux_assiduite:
                    type: number
                    format: float
                  nb_present:
                    type: integer
                  nb_total_activites_obligatoires:
                    type: integer

  # ==================== G - STATISTIQUES D'UNE COLLECTIVITÉ ====================
  /collectivites/{collectiviteId}/statistiques/globales:
    get:
      tags: [Statistiques]
      summary: Rapport mensuel du président (taux d'assiduité global + nombre de membres actifs)
      description: |
        Le président doit faire un rapport mensuel auprès de la fédération.
        Utilisé pour identifier si une collectivité est encore pérenne.
      parameters:
        - $ref: '#/components/parameters/collectiviteIdParam'
        - name: annee
          in: query
          required: true
          schema:
            type: integer
        - name: mois
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 12
      responses:
        '200':
          description: Rapport mensuel
          content:
            application/json:
              schema:
                type: object
                properties:
                  collectivite_id:
                    type: string
                  annee:
                    type: integer
                  mois:
                    type: integer
                  nb_membres_actifs:
                    type: integer
                  taux_assiduite_global:
                    type: number
                    format: float
                  statut_perennite:
                    type: string
                    enum: [perenne, a_surveiller, critique]

  /collectivites/{collectiviteId}/membres/{membreId}/statistiques:
    get:
      tags: [Statistiques]
      summary: Statistiques détaillées d'un membre actif
      description: |
        En interne, le président a besoin pour chaque membre actif :
        - Taux d'assiduité sur une période
        - Montant encaissé sur une période
        - Montant impayé potentiel
      parameters:
        - $ref: '#/components/parameters/collectiviteIdParam'
        - $ref: '#/components/parameters/membreIdParam'
        - name: date_debut
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: date_fin
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Statistiques du membre
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatistiquesMembre'

  /collectivites/{collectiviteId}/statistiques/membres:
    get:
      tags: [Statistiques]
      summary: Statistiques détaillées de tous les membres actifs
      description: Permet au président d'avoir une vue d'ensemble
      parameters:
        - $ref: '#/components/parameters/collectiviteIdParam'
        - name: date_debut
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: date_fin
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Liste des statistiques par membre
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StatistiquesMembre'

  # ==================== ÉLECTIONS ET MANDATS (FONCTIONNALITÉS TRANSVERSALES) ====================
  /collectivites/{collectiviteId}/mandats:
    get:
      tags: [Collectivités]
      summary: Lister les mandats d'une collectivité
     